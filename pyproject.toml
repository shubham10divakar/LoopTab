[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "looptab"
version = "0.1.0"
description = "LoopTab: Residual-Loop Feature Attention for Tabular Fraud Detection"
requires-python = ">=3.10"
dependencies = ["torch>=2.0", "numpy", "pandas", "scikit-learn", "pyyaml"]

[project.optional-dependencies]
baselines = ["xgboost>=2.0", "lightgbm>=4.0"]
extras = ["matplotlib", "optuna", "kaggle"]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["looptab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
